services:
  runner-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RUNNER_API_SECRET: ${RUNNER_API_SECRET:?Set RUNNER_API_SECRET in the environment}
      RUNNER_DATA_DIR: /var/lib/bothost
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - runner-data:/var/lib/bothost
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50

volumes:
  runner-data:
